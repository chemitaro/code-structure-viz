name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify spec-dock runtime script exists
        run: test -f ./spec-dock/scripts/spec-dock
      - name: Sync generated state (local only)
        run: python3 ./spec-dock/scripts/spec-dock sync
      - name: Validate spec-dock workspace
        run: python3 ./spec-dock/scripts/spec-dock validate

  product-test-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build pinned Python 3.12 and Git 2.39.5 environment
        run: >-
          docker build
          --file ci/toolchains/git-2.39.5.Dockerfile
          --tag code-structure-viz-minimum
          .
      - name: Verify minimum toolchain and full product gate
        run: |
          docker run --rm --volume "${{ github.workspace }}:/workspace" code-structure-viz-minimum sh -euxc '
            test "$(git --version)" = "git version 2.39.5"
            uv sync --frozen --all-groups
            uv run ruff format --check .
            uv run ruff check .
            uv run mypy src tests
            uv run pytest -q
            uv build --offline
          '

  product-test-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: ci/latest-python.txt
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.11.24"
          enable-cache: false
      - name: Verify latest supported toolchain and full tests
        run: |
          python -c 'import pathlib, sys; expected = pathlib.Path("ci/latest-python.txt").read_text().strip(); assert sys.version.startswith(expected + ".")'
          python -c 'import re, subprocess; value = subprocess.check_output(["git", "--version"], text=True); match = re.fullmatch(r"git version (\d+)\.(\d+).*\n", value); assert match and tuple(map(int, match.groups())) >= (2, 39)'
          uv sync --frozen --all-groups
          uv run pytest -q

  product-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.11.24"
          enable-cache: false
      - name: Verify macOS filesystem behavior
        run: |
          python -c 'import re, subprocess; value = subprocess.check_output(["git", "--version"], text=True); match = re.fullmatch(r"git version (\d+)\.(\d+).*\n", value); assert match and tuple(map(int, match.groups())) >= (2, 39)'
          uv sync --frozen --all-groups
          uv run pytest -q

  product-package-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.11.24"
          enable-cache: false
      - name: Build and verify offline wheel
        run: |
          uv sync --frozen --all-groups
          uv build --offline
          python -m venv .offline-venv
          .offline-venv/bin/python -m pip install --no-index dist/*.whl
          .offline-venv/bin/code-structure-viz --version
          uv run pytest tests/packaging/test_distribution.py -q

  product-contract-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.11.24"
          enable-cache: false
      - name: Verify contracts, static safety, and SpecDock coexistence
        run: |
          uv sync --frozen --all-groups
          uv run pytest tests/contracts tests/security -q
          python3 ./spec-dock/scripts/spec-dock validate
